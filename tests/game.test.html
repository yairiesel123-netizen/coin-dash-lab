<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Coin Dash tests</title></head>
<body>
<div id="game"></div>
<pre id="results">running…</pre>
<script>
// Headless Chrome does not paint, so drive animation frames from timers instead.
window.requestAnimationFrame = callback => setTimeout(() => callback(performance.now()), 16);
window.cancelAnimationFrame = id => clearTimeout(id);
</script>
<script src="../vendor/phaser-3.90.0.min.js"></script>
<script src="../settings.js"></script><script src="../game.js"></script>
<script>
/* global COIN_DASH */
// Drives the real game through its scenes and checks the menu and two-player rules.
const game = window.coinDashGame;
const results = [];
const frames = (n = 3) => new Promise(done => {
  const step = () => (n-- <= 0 ? done() : requestAnimationFrame(step));
  requestAnimationFrame(step);
});
const press = async (key, code, keyCode) => {
  for (const type of ['keydown', 'keyup']) {
    const event = new KeyboardEvent(type, { key, code, bubbles: true });
    Object.defineProperty(event, 'keyCode', { get: () => keyCode });
    Object.defineProperty(event, 'which', { get: () => keyCode });
    window.dispatchEvent(event);
    await frames(2);
  }
  await frames(3);
};
const scene = key => game.scene.getScene(key);
const texts = s => s.children.list.filter(o => o.type === 'Text').map(o => o.text).join('\n');
const check = (name, ok, detail = '') => results.push({ name, ok: Boolean(ok), detail });
// Park the drones in a corner so they only touch a player when a test says so.
const parkDrones = s => s.drones.getChildren().forEach(d => { d.body.stop(); d.body.reset(780, 480); });
const startTwoPlayer = async () => {
  scene('CoinDash').scene.start('CoinDash', { mode: 2 });
  await frames(4);
  const s = scene('CoinDash');
  parkDrones(s);
  return s;
};
const endRound = async s => { s.deadline = s.time.now - 1; await frames(3); };

async function run() {
  localStorage.removeItem(COIN_DASH.highScoreKey);
  await frames(10);
  check('Game opens on the menu', game.scene.isActive('Menu') && !game.scene.isActive('CoinDash'));
  check('Menu offers single and two players',
    /Press 1 for single player/.test(texts(scene('Menu'))) && /Press 2 for two players/.test(texts(scene('Menu'))));

  const menu = scene('Menu');
  check('Menu has a YOUR CHOICE section', /YOUR CHOICE/.test(texts(menu)));
  check('Menu offers rectangle, bird and man',
    ['Rectangle', 'Bird', 'Man'].every(label => texts(menu).includes(label)), texts(menu));
  check('Rectangle is chosen by default', game.registry.get('avatar') === 'rectangle');
  await press('ArrowRight', 'ArrowRight', 39);
  check('Right arrow picks the bird', game.registry.get('avatar') === 'bird');
  await press('ArrowRight', 'ArrowRight', 39);
  check('Right arrow again picks the man', game.registry.get('avatar') === 'man');
  await press('ArrowRight', 'ArrowRight', 39);
  check('The choice wraps around to the rectangle', game.registry.get('avatar') === 'rectangle');
  await press('ArrowLeft', 'ArrowLeft', 37);
  check('Left arrow wraps back to the man', game.registry.get('avatar') === 'man');
  await press('ArrowLeft', 'ArrowLeft', 37);
  check('Left arrow picks the bird', game.registry.get('avatar') === 'bird');

  await press('2', 'Digit2', 50);
  check('Arrow keys do not change the character on the instructions screen',
    (await press('ArrowRight', 'ArrowRight', 39), game.registry.get('avatar') === 'bird'));
  const help = texts(scene('Menu'));
  check('Pressing 2 shows the two-player instructions without starting', game.scene.isActive('Menu'));
  check('Instructions explain arrows for Player 1', /Player 1: arrow keys/.test(help), help);
  check('Instructions explain W/S up-down and A/D left-right for Player 2',
    /W\/S up and down, A\/D left and right/.test(help), help);
  check('Instructions mention the 60-second round', /60 seconds/.test(help), help);

  await press(' ', 'Space', 32);
  let s = scene('CoinDash');
  check('Space starts a two-player round', game.scene.isActive('CoinDash') && s.mode === 2);
  check('Two-player round has two players', s.players.length === 2);
  check('Two-player round lasts 60 seconds',
    Math.abs((s.deadline - s.time.now) / 1000 - 60) < 3, `${(s.deadline - s.time.now) / 1000}s`);
  parkDrones(s);

  const [p1, p2] = s.players;
  check('Both players use the chosen character',
    s.players.every(p => p.sprite.texture.key === 'avatar-bird'));
  check('Players keep their own colours',
    p1.sprite.tintTopLeft === COIN_DASH.colors.player && p2.sprite.tintTopLeft === COIN_DASH.colors.player2);
  s.cursors.right.isDown = true; await frames(2);
  check('Arrow keys move Player 1 only', p1.sprite.body.velocity.x > 0 && p2.sprite.body.velocity.x === 0);
  s.cursors.right.isDown = false;
  s.keys.D.isDown = true; await frames(2);
  check('D moves Player 2 only', p2.sprite.body.velocity.x > 0 && p1.sprite.body.velocity.x === 0);
  s.keys.D.isDown = false;
  s.keys.S.isDown = true; await frames(2);
  check('S moves Player 2 down', p2.sprite.body.velocity.y > 0 && p1.sprite.body.velocity.y === 0);
  s.keys.S.isDown = false; await frames(2);

  const drone = s.drones.getChildren()[0];
  drone.body.reset(p1.sprite.x, p1.sprite.y); await frames(3);
  check('A drone knocks Player 1 out', p1.out && !p1.sprite.visible && !p1.sprite.body.enable);
  check('The round keeps running after one player is caught', !s.finished);
  check('HUD marks the caught player as OUT', /P1: \d+ \(OUT\)/.test(s.hud.text), s.hud.text);
  parkDrones(s);

  const before = p2.score;
  s.coin.body.reset(p2.sprite.x, p2.sprite.y); s.coin.setPosition(p2.sprite.x, p2.sprite.y);
  await frames(3);
  check('Remaining player still collects coins', p2.score === before + 1, `${before} -> ${p2.score}`);
  check('Two-player coins do not change the single-player record',
    localStorage.getItem(COIN_DASH.highScoreKey) === null);
  s.keys.A.isDown = true; await frames(2);
  check('Remaining player can still move', p2.sprite.body.velocity.x < 0);
  s.keys.A.isDown = false;

  p1.score = 5; p2.score = 3; await endRound(s);
  check('Time up ends the round', s.finished);
  check('Higher score wins even if that player was caught',
    /Player 1 wins!/.test(texts(s)) && /P1: 5 coins · P2: 3 coins/.test(texts(s)), texts(s));

  s = await startTwoPlayer();
  s.players[0].score = 2; s.players[1].score = 7; await endRound(s);
  check('Player 2 wins with more coins', /Player 2 wins!/.test(texts(s)), texts(s));

  s = await startTwoPlayer();
  s.players[0].score = 4; s.players[1].score = 4; await endRound(s);
  check('Equal scores are a draw', /It's a draw!/.test(texts(s)) && !/wins!/.test(texts(s)), texts(s));

  s = await startTwoPlayer();
  s.players[1].score = 1;
  s.knockOut(s.players[0]); await frames(2);
  check('One knock-out does not end the round', !s.finished);
  s.knockOut(s.players[1]); await frames(2);
  check('Both players caught ends the round early',
    s.finished && /Both players were caught!/.test(texts(s)) && /Player 2 wins!/.test(texts(s)), texts(s));

  await press('r', 'KeyR', 82);
  s = scene('CoinDash');
  check('R restarts in two-player mode', s.mode === 2 && !s.finished && s.players.every(p => !p.out && p.score === 0));

  await press('m', 'KeyM', 77);
  check('M returns to the menu', game.scene.isActive('Menu') && !game.scene.isActive('CoinDash'));
  check('The menu remembers the chosen character', game.registry.get('avatar') === 'bird');
  await press('ArrowRight', 'ArrowRight', 39);

  await press('1', 'Digit1', 49);
  s = scene('CoinDash');
  check('Pressing 1 starts single player', game.scene.isActive('CoinDash') && s.mode === 1 && s.players.length === 1);
  check('Single player round still lasts 45 seconds', Math.abs((s.deadline - s.time.now) / 1000 - 45) < 3);
  parkDrones(s);
  const solo = s.players[0];
  check('Single player uses the newly chosen man', solo.sprite.texture.key === 'avatar-man');
  s.cursors.left.isDown = true; await frames(2);
  const arrowsWork = solo.sprite.body.velocity.x < 0;
  s.cursors.left.isDown = false; s.keys.W.isDown = true; await frames(2);
  check('Single player moves with both arrows and WASD', arrowsWork && solo.sprite.body.velocity.y < 0);
  s.keys.W.isDown = false; await frames(2);
  s.coin.body.reset(solo.sprite.x, solo.sprite.y); s.coin.setPosition(solo.sprite.x, solo.sprite.y);
  await frames(3);
  check('Single player coins set the record',
    localStorage.getItem(COIN_DASH.highScoreKey) === '1' && /Record: 1/.test(s.hud.text), s.hud.text);
  s.drones.getChildren()[0].body.reset(solo.sprite.x, solo.sprite.y); await frames(3);
  check('Single player round ends when a drone catches you',
    s.finished && /A drone caught you!/.test(texts(s)), texts(s));
}

run().catch(error => check('Test run crashed', false, String(error && error.stack || error))).finally(() => {
  const failed = results.filter(r => !r.ok).length;
  document.getElementById('results').textContent = results
    .map(r => `${r.ok ? 'PASS' : 'FAIL'} ${r.name}${r.ok || !r.detail ? '' : ` — ${r.detail.replace(/\n/g, ' | ')}`}`)
    .join('\n') + `\n\n${results.length - failed} passed, ${failed} failed`;
  document.title = failed ? 'FAILED' : 'PASSED';
});
</script>
</body>
</html>
